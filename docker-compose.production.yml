# Use with: docker compose -f docker-compose.yml -f docker-compose.production.yml up --build -d
services:
  db:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a strong database password}
  api:
    environment:
      NODE_ENV: production
      SEED_DEMO: "false"
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?Set a strong database password}@db:5432/leadership_dna?schema=public
      JWT_SECRET: ${JWT_SECRET:?Set a random JWT secret of at least 32 characters}
      APP_ORIGIN: ${APP_ORIGIN:?Set the public HTTPS origin}
      RESEND_API_KEY: ${RESEND_API_KEY:?Set the Resend API key}
      EMAIL_FROM: ${EMAIL_FROM:?Set the verified sender}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:?Set the R2 account ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:?Set the R2 access key ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:?Set the R2 secret access key}
      R2_BUCKET: ${R2_BUCKET:?Set the private R2 bucket}
  web:
    ports: !override
      - "127.0.0.1:${APP_PORT:-8080}:80"
